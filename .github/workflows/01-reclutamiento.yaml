name: Reclotamiento de agente
on: push
jobs:
    reporte-de-reclutamiento:
        runs-on: ubuntu-latest
        steps:
            - name: el agente se presenta
              run: echo "El agente se presenta"
            - name: Reporte de identeidad
              run: |
                  echo "Reporte de identidad"
                  echo "Nombre: Juan Perez"
                  echo "Edad: 30"
                  echo "Experiencia: 5 años en ventas"
                  echo ""
                  echo "Nombre clave ${{github.actor}}"
                  echo ""
                  echo "Repositorio: ${{github.repository}}"
                  echo "Evento: ${{github.sha}}"
                  echo "Metadata: ${{tojson(github)}}"
            - name: Capacidades del agente
              run: |
                  echo "capacidades detectadas:"
                  echo "sistema operaticos: Linux, Windows, MacOS"
                  uname -a
                  echo "lenguajes de programacion: Python, JavaScript, Java, C++"
                  node --version
                  python --version
                  git --version
